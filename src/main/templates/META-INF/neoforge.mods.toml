modLoader = "javafml"
loaderVersion = "[1,)"
license = "LGPL-3.0-only"
issueTrackerURL = "https://github.com/avectus1/Fast-Sounds-Neo/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "FastSounds Neo"
logoFile = "logo.png"
logoBlur = false
displayURL = "https://github.com/avectus1/Fast-Sounds-Neo"
authors = "Misanthropy (original), avectus1 (NeoForge port)"
credits = "Original FastSounds by Misanthropy. Based on Leandrohunter's unofficial NeoForge 1.21.1 port and the FastSounds 0.6 source."
description = '''Improves performance by optimizing sound handling in Minecraft. Unofficial NeoForge 1.21.1 port of FastSounds by Misanthropy. Client-side only.'''
displayTest = "IGNORE_ALL_VERSION"

[[mixins]]
config = "fastsounds.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,21.2)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1]"
ordering = "NONE"
side = "CLIENT"
