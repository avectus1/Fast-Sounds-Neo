plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = 'com.misanthropy.linggango'

base {
    archivesName = "fastsounds-neo-1.21.1"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Dev-only test harness, never shipped in the release jar.
sourceSets {
    testmod {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}


neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            gameDirectory = project.file('run')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (project.hasProperty('fstest')) {
                sourceSet = sourceSets.testmod
            }
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        if (project.hasProperty('fstest')) {
            "fstest" {
                sourceSet(sourceSets.testmod)
            }
        }
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            mod_id     : mod_id,
            mod_version: mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
neoForge.addModdingDependenciesTo(sourceSets.testmod)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    from('LICENSE', 'COPYING', 'NOTICE')
    manifest {
        attributes(
                'Implementation-Title': 'FastSounds Neo',
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'Misanthropy (original), avectus1 (NeoForge port)'
        )
    }
}
